  .vs-ver-tab::before {

  .vs-row:hover { background: rgba(56,139,253,0.06); }
  .vs-dot {

  .vs-time {

    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;

  .page-loader.done { opacity: 0; visibility: hidden; }
  .loader-svg { width: 84px; height: 84px; color: var(--accent); }
  .loader-path { stroke-dasharray: 100; stroke-dashoffset: 100; animation: loaderDraw 1.1s ease forwards; }
  @keyframes loaderDraw { to { stroke-dashoffset: 0; } }
  .loader-name {
    font-family: "Noto Serif SC", Georgia, serif; font-size: 20px; font-weight: 700;

  .loading-hint {

  .load-skip:active { background: rgba(2,132,199,0.16); }
  .load-skip small { font-size: 11px; opacity: 0.75; }
  .theme-toggle {

      { lv: "[ADD]", time: "2026-09-18 09:12:00", text: "站点上线：全世界语言的「欢迎你的到来」欢迎页。" },
      { lv: "[ADD]", time: "2026-09-18 09:10:36", text: "深色页脚 + 灰白大字 Yaule，WorkBuddy 风格。" }
    ]}
  ];

/* ========== 读取主页同步数据（localStorage） ========== */
var logs = FALLBACK_LOGS;
var synced = false;
try {
  var raw = localStorage.getItem('yaule_changelog');
  if (raw) {
    var parsed = JSON.parse(raw);
    if (parsed && parsed.length) { logs = parsed; synced = true; }
  }
} catch (e) {}

/* ========== 渲染日志 ========== */
var lvClass = { "[ADD]": "cat-add", "[INFO]": "cat-info", "[FIX]": "cat-fix", "[DEL]": "cat-del", "[WARN]": "cat-warn" };
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function rowHtml(item) {
  var cls = lvClass[item.lv] || 'cat-info';
  return '<div class="vs-row ' + cls + '"><span class="vs-dot"></span><span class="vs-time">' + esc(item.time || '') + '</span><span class="vs-tag">' + esc(item.lv || '') + '</span><span class="vs-text">' + esc(item.text || '') + '</span></div>';
}
function verHtml(v) {
  var rows = (v.list || []).map(rowHtml).join('');
  return '<div class="vs-ver' + (v.current ? ' current' : '') + '"><div class="vs-ver-head"><span class="vs-ver-tab">' + esc(v.ver) + '</span><span class="vs-ver-date">' + esc(v.date) + '</span>' + (v.current ? '<span class="vs-ver-badge">当前版本</span>' : '') + '</div><div class="vs-rows">' + rows + '</div></div>';
}
function render() {
  var box = document.getElementById('mcLog');
  if (!box) return;
  box.innerHTML = logs.map(verHtml).join('');
  var note = document.getElementById('syncNote');
  note.textContent = synced
    ? '已读取主页同步的最新日志（' + logs.length + ' 个版本）。每次打开主页都会自动更新本页。'
    : '尚未在本机打开过主页，当前展示内置日志。打开主页后会自动同步为最新记录。';
}
render();

/* ========== 最后同步时间（实时） ========== */
(function () {
  var el = document.getElementById('updatedAt');
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    var d = new Date();
    el.textContent = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
})();

/* ========== 8 秒伪进度条 + 长按加速 + 第 3 秒弹出 ========== */
(function () {
  var loader = document.getElementById('pageLoader');
  var bar = document.getElementById('loadBar');
  var pct = document.getElementById('loadPercent');
  var skip = document.getElementById('loadSkip');
  var progress = 0;
  var boost = null;
  var boostStart = 0;
  var doneFlag = false;
  var timer = setInterval(function () {
    progress += Math.random() * 2.2;
    if (progress > 95) progress = 95;
    bar.style.width = progress + '%';
    pct.textContent = Math.floor(progress) + '%';
  }, 100);
  var hint = document.getElementById('loadHint');
  if (hint) {
    var LOAD_LINES = ['正在泡咖啡…', '正在数星星…', '正在整理日志…', '正在点亮灯笼…', '正在问候全世界…', '正在翻今天的日记…'];
    hint.textContent = LOAD_LINES[Math.floor(Math.random() * LOAD_LINES.length)];
  }
  var skipTimer = setTimeout(function () { if (skip) skip.classList.add('show'); }, 3000);
  function finishLoad() {
    if (doneFlag) return;
    doneFlag = true;
    if (timer) clearInterval(timer);
    if (skipTimer) clearTimeout(skipTimer);
    if (boost) clearInterval(boost);
    bar.style.width = '100%';
    pct.textContent = '100%';
    setTimeout(function () {
      loader.classList.add('done');
      setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 500);
    }, 300);
  }
  // 长按加速：按得越久越快；到 95% 冲满并立即进入（按钮第 3 秒出现，但其位置从第 0 秒就可按住）
  if (skip) {
    function startBoost() {
      if (boost) return;
      boostStart = Date.now();
      boost = setInterval(function () {
        var hold = (Date.now() - boostStart) / 1000;
        var inc = 2 + hold * 4;
        progress += inc;
        if (progress >= 95) {
          progress = 95;
          bar.style.width = '95%';
          pct.textContent = '95%';
          finishLoad();
          return;
        }
        bar.style.width = progress + '%';
        pct.textContent = Math.floor(progress) + '%';
      }, 70);
    }
    function stopBoost() {
      if (boost) { clearInterval(boost); boost = null; }
    }
    skip.addEventListener('mousedown', startBoost);
    skip.addEventListener('touchstart', startBoost, { passive: true });
    ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(function (ev) {
      skip.addEventListener(ev, stopBoost);
    });
  }
  setTimeout(finishLoad, 8000);
})();

/* ========== 主题切换 ========== */
(function () {
  var toggle = document.getElementById('themeToggle');
  var root = document.documentElement;
  function applyTheme() {
    var saved = null;
    try { saved = localStorage.getItem('yaule-theme'); } catch (e) {}
    if (saved === 'dark') { root.setAttribute('data-theme', 'dark'); return; }
    if (saved === 'light') { root.removeAttribute('data-theme'); return; }
    var h = new Date().getHours();
    if (h >= 22 || h < 6) root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
  }
  applyTheme();
  setInterval(applyTheme, 1800000);
  toggle.addEventListener('click', function () {
    if (root.getAttribute('data-theme') === 'dark') {
      root.removeAttribute('data-theme');
      try { localStorage.setItem('yaule-theme', 'light'); } catch (e) {}
    } else {
      root.setAttribute('data-theme', 'dark');
      try { localStorage.setItem('yaule-theme', 'dark'); } catch (e) {}
    }
  });
})();
</script>
</body>
