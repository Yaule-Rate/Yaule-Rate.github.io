<style>
  :root {

  :root[data-theme="light"] {

    --ink-2: #59636e;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background:

    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 24px 40px; }
  .stage { text-align: center; max-width: 640px; width: 100%; }
  .logo { font-size: 15px; letter-spacing: .28em; color: var(--ink-2); margin-bottom: 34px; }
  .logo b { color: var(--accent); font-weight: 700; }
  .y-wrap { margin: 0 auto 26px; width: 150px; height: 150px; }
  .y-wrap svg { width: 100%; height: 100%; filter: drop-shadow(0 0 26px rgba(71, 211, 198, .35)); }
  .y-stroke { stroke-dasharray: 340; stroke-dashoffset: 340; animation: ydraw 1.6s ease forwards; }
  @keyframes ydraw { to { stroke-dashoffset: 0; } }
  .code { font-size: clamp(64px, 12vw, 120px); font-weight: 800; line-height: 1; letter-spacing: .02em; }
  .code em { font-style: normal; color: var(--accent); }
  h1 { margin-top: 14px; font-size: clamp(20px, 4vw, 28px); font-weight: 700; }
  .en { margin-top: 8px; color: var(--ink-2); font-size: 15px; letter-spacing: .04em; }
  .desc { margin-top: 18px; color: var(--ink-2); font-size: 14px; line-height: 1.9; }
  .actions { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 26px; border-radius: 999px;
    font-size: 15px; text-decoration: none; transition: transform .18s, box-shadow .18s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #06221f; font-weight: 700;
    box-shadow: 0 6px 22px rgba(71, 211, 198, .28);
  }
  .btn-ghost {
    border: 1px solid var(--line); color: var(--ink);
    background: var(--card);
  }
  .btn:hover { transform: translateY(-2px); }
  .btn svg { width: 16px; height: 16px; }
  .links { margin-top: 30px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  .links a { color: var(--ink-2); font-size: 13px; text-decoration: none; border-bottom: 1px dashed var(--line); padding-bottom: 2px; transition: color .18s; }
  .links a:hover { color: var(--accent); }
  footer {
    background: #05080c;
    padding: 26px 24px;
    text-align: center; color: #6e7681; font-size: 13px;
  }
  :root[data-theme="light"] footer { background: #0d1218; }
  footer a { color: #8b949e; text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ===== 页面转场（View Transitions）===== */
  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: yt-out .22s ease both; }
  ::view-transition-new(root) { animation: yt-in .34s ease both; }
  @keyframes yt-out { to { opacity: 0; transform: scale(.98); } }
  @keyframes yt-in { from { opacity: 0; transform: translateY(12px); } }

  @media (prefers-reduced-motion: reduce) {
    .y-stroke { animation: none; stroke-dashoffset: 0; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  }
</style>
</head>

<script>
  // 主题跟随主页设置
  (function () {
    try {
      var t = localStorage.getItem('yaule-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    // 22:00–06:00 自动深色（仅当用户未手动选择过）
    var h = new Date().getHours();
    if (h >= 22 || h < 6) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
