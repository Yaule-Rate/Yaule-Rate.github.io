<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运行状态 · Yaule</title>
<meta name="description" content="Yaule's personal site — service status page.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D4AF37'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='34' font-weight='bold' fill='%23fff' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root { --bg:#0C0E0D; --bg2:#141815; --card-bg:#161A18; --ink:#EAE4D5; --ink-2:#A29B8A; --line:#262B29; --accent:#D4AF37; --accent-2:#E8CC7A; --soft:#1A1F1D; --ok:#10B981; --warn:#F59E0B; --err:#EF4444; --skip:#9CA3AF }
  :root[data-theme="dark"] { --bg:#0C0E0D; --bg2:#141815; --card-bg:#161A18; --ink:#EAE4D5; --ink-2:#A29B8A; --line:#262B29; --accent:#D4AF37; --accent-2:#E8CC7A; --soft:#1A1F1D; --ok:#34D399; --warn:#FBBF24; --err:#F87171; --skip:#6B7280 }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--bg); color: var(--ink); font-family: "Nunito", "Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  .topbar { position: sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); border-bottom:1px solid var(--line); }
  .topbar .brand { display:flex; align-items:center; gap:12px; font-weight:700; font-size:17px; letter-spacing:.04em; }
  .topbar .brand svg { width:24px; height:24px; color: var(--accent); }
  .topbar .lang { font-family: inherit; border:1px solid var(--line); background:var(--card-bg); color:var(--ink); border-radius:999px; padding:6px 16px; font-size:13px; cursor:pointer; }
  .hero { text-align:center; padding:56px 20px 26px; }
  .kicker { font-size:12px; letter-spacing:.34em; color:var(--accent); font-weight:600; margin:0 0 10px; }
  h1 { font-size:34px; margin:0 0 10px; font-weight:700; }
  .hero p.sub { color:var(--ink-2); font-size:15px; margin:0; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:16px; max-width:1080px; margin:30px auto 46px; padding:0 22px; }
  .card { background:var(--card-bg); border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:8px; transition:border-color .2s; }
  .card:hover { border-color:var(--accent); }
  .card .row1 { display:flex; align-items:center; gap:10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--skip); box-shadow:0 0 0 0 rgba(0,0,0,0); }
  .dot.ok { background:var(--ok); animation:pulse 2.2s infinite; }
  .dot.warn { background:var(--warn); }
  .dot.err { background:var(--err); }
  .dot.skip { background:var(--skip); }
  @keyframes pulse { 0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--ok) 45%, transparent);} 70%{ box-shadow:0 0 0 9px transparent;} 100%{ box-shadow:0 0 0 0 transparent;} }
  .card h3 { font-size:15.5px; font-weight:600; margin:0; flex:1; }
  .card .url { font-size:12px; color:var(--ink-2); word-break:break-all; }
  .card .st { font-size:12.5px; color:var(--ink-2); }
  .card .st b.ok { color:var(--ok); } .card .st b.warn { color:var(--warn); } .card .st b.err { color:var(--err); } .card .st b.skip { color:var(--skip); }
  .meta { max-width:1080px; margin:0 auto 40px; padding:0 22px; display:flex; flex-wrap:wrap; gap:12px; }
  .meta .m { background:var(--card-bg); border:1px solid var(--line); border-radius:12px; padding:10px 18px; font-size:13px; color:var(--ink-2); }
  .meta .m b { color:var(--ink); font-weight:600; }
  .legend { display:flex; gap:18px; justify-content:center; font-size:12.5px; color:var(--ink-2); margin:0 0 8px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .btn-back { display:inline-block; margin:0 auto 60px; padding:11px 28px; border:1px solid var(--accent); color:var(--accent); border-radius:999px; font-size:14px; font-weight:600; transition:background .2s,color .2s; }
  .btn-back:hover { background:var(--accent); color:#fff; }
  .foot { border-top:1px solid var(--line); text-align:center; padding:30px 0; font-size:13px; color:var(--ink-2); }
  .foot .big { font-size:56px; font-weight:900; letter-spacing:.14em; color:var(--accent); opacity:.16; display:block; line-height:1; }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="9" opacity=".35"/></svg><span>Yaule</span></a>
  <button class="lang" id="langBtn" type="button">EN</button>
</div>
<div class="hero">
  <p class="kicker">SERVICE STATUS</p>
  <h1 data-i18n="st.h1">运行状态</h1>
  <p class="sub" data-i18n="st.sub">自动探测本站各服务与作品页的可达性，刷新页面重新检测。</p>
</div>
<div class="legend">
  <span><span class="dot ok"></span><span data-i18n="st.ok">在线</span></span>
  <span><span class="dot warn"></span><span data-i18n="st.warn">较慢</span></span>
  <span><span class="dot err"></span><span data-i18n="st.err">异常</span></span>
  <span><span class="dot skip"></span><span data-i18n="st.skip">未接入</span></span>
</div>
<div class="grid" id="grid"></div>
<div class="meta">
  <span class="m"><span data-i18n="st.ver">站点版本</span> <b>v29</b></span>
  <span class="m"><span data-i18n="st.since">上线于</span> <b>2026-09-24</b></span>
  <span class="m"><span data-i18n="st.day">已运行</span> <b id="days">–</b> <span data-i18n="st.days">天</span></span>
  <span class="m"><span data-i18n="st.check">检测时间</span> <b id="checkAt">–</b></span>
</div>
<div style="text-align:center">
  <a class="btn-back" href="index.html" data-i18n="st.back">返回首页</a>
</div>
<div class="foot"><span class="big">Yaule</span><span data-i18n="st.pw">Powered by GitHub Pages · Status</span></div>

<script>
  var I18N = {
    zh: { 'st.h1':'运行状态','st.sub':'自动探测本站各服务与作品页的可达性，刷新页面重新检测。','st.ok':'在线','st.warn':'较慢','st.err':'异常','st.skip':'未接入','st.ver':'站点版本','st.since':'上线于','st.day':'已运行','st.days':'天','st.check':'检测时间','st.back':'返回首页','st.pw':'Powered by GitHub Pages · Status','st.main':'主页','st.all':'全部作品','st.log':'更新日志','st.w1':'兴华广播站系统','st.w2':'自助记账系统','st.w3':'代码编写系统','st.w4':'表情转图片转换器','st.w5':'CS 灵敏度校准','st.w6':'棋类棋和','st.api':'外部接口','st.github':'GitHub API','st.hitokoto':'一言','st.weather':'天气','st.netease':'网易云音乐','st.cdn':'jsDelivr CDN','st.ready':'就绪','st.slow':'较慢','st.err':'无法访问','st.skip':'浏览器限制或未探测','st.na':'未知' },
    en: { 'st.h1':'Service Status','st.sub':'Auto-check reachability of site services and works pages. Refresh to re-run.','st.ok':'Online','st.warn':'Slow','st.err':'Error','st.skip':'Skipped','st.ver':'Version','st.since':'Launched','st.day':'Uptime','st.days':'days','st.check':'Checked at','st.back':'Back to Home','st.pw':'Powered by GitHub Pages · Status','st.main':'Home','st.all':'All Works','st.log':'Changelog','st.w1':'Xinghua Broadcast System','st.w2':'Self-Service Accounting','st.w3':'Code Writing System','st.w4':'Emoji to Image Converter','st.w5':'CS Sens Calibrator','st.w6':'Chess & Gomoku','st.api':'External API','st.github':'GitHub API','st.hitokoto':'Hitokoto','st.weather':'Weather','st.netease':'NetEase Music','st.cdn':'jsDelivr CDN','st.ready':'Ready','st.slow':'Slow','st.err':'Unreachable','st.skip':'Browser-limited / not probed','st.na':'Unknown' }
  };
  function getLang(){ try { return localStorage.getItem('yaule_lang')==='en'?'en':'zh'; }catch(e){ return 'zh'; } }
  function t(k){ var L=getLang(); return (I18N[L]&&I18N[L][k])||I18N.zh[k]; }
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
  document.documentElement.lang = getLang()==='en'?'en':'zh-CN';
  try { if (localStorage.getItem('yaule_theme')==='dark' || (!localStorage.getItem('yaule_theme') && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme','dark'); } catch(e){}
  document.getElementById('langBtn').textContent = getLang()==='en'?'中':'EN';
  document.getElementById('langBtn').addEventListener('click', function(){
    var L = getLang()==='en'?'zh':'en';
    try { localStorage.setItem('yaule_lang', L); } catch(e){}
    location.reload();
  });
  var since = new Date(2026, 8, 24);
  document.getElementById('days').textContent = Math.max(0, Math.floor((Date.now()-since.getTime())/86400000));
  var d = new Date(); document.getElementById('checkAt').textContent = (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');

  var ITEMS = [
    { name:'st.main', url:'index.html', group:'st.main' },
    { name:'st.all', url:'works.html', group:'st.works' },
    { name:'st.log', url:'changelog.html', group:'st.works' },
    { name:'st.w1', url:'works/xinghua.html', group:'st.works' },
    { name:'st.w2', url:'works/accounting.html', group:'st.works' },
    { name:'st.w3', url:'works/code-system.html', group:'st.works' },
    { name:'st.w4', url:'works/emoji-converter.html', group:'st.works' },
    { name:'st.w5', url:'works/cs-sens.html', group:'st.works' },
    { name:'st.w6', url:'works/chess.html', group:'st.works' },
    { name:'st.github', url:'https://api.github.com/repos/AlanLumier/AlanLumier.github.io', group:'st.api' },
    { name:'st.hitokoto', url:'https://v1.hitokoto.cn/?encode=json', group:'st.api' },
    { name:'st.weather', url:'https://wttr.in/?format=j1', group:'st.api' },
    { name:'st.cdn', url:'https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js', group:'st.api' },
    { name:'st.netease', url:'https://music.163.com', group:'st.api', cors:false }
  ];
  var grid = document.getElementById('grid');
  function card(it, st, cls, ms, url){
    var li = document.createElement('div'); li.className='card';
    li.innerHTML = '<div class="row1"><span class="dot '+cls+'"></span><h3>'+t(it.name)+'</h3></div>'+
      '<span class="url">'+(url||it.url)+'</span>'+
      '<span class="st"><b class="'+cls+'">'+(st==='--'?'--':t(st))+'</b>'+(ms!=null?' · '+ms+'ms':'')+'</span>';
    grid.appendChild(li);
  }
  function probe(it, cb){
    if (it.cors === false) { cb('st.skip','skip',null); return; }
    var t0 = performance.now();
    var ctl = new AbortController(); var tid = setTimeout(function(){ ctl.abort(); }, 9000);
    fetch(it.url, { method:'HEAD', cache:'no-store', signal: ctl.signal })
      .then(function(r){ clearTimeout(tid); var ms = Math.round(performance.now()-t0);
        if (r.ok) cb(ms < 800 ? 'st.ready' : 'st.slow', ms < 800 ? 'ok' : 'warn', ms);
        else cb('st.err','err',ms); })
      .catch(function(){ clearTimeout(tid); var ms = Math.round(performance.now()-t0);
        if (ms >= 9000) cb('st.slow','warn',ms); else cb('st.err','err',ms); });
  }
  ITEMS.forEach(function(it, i){
    card(it, 'st.na', 'skip', null, it.url);
    probe(it, function(stxt, cls, ms){ grid.children[i].querySelector('.dot').className = 'dot '+cls; grid.children[i].querySelector('.st b').textContent = t(stxt); if (ms!=null) grid.children[i].querySelector('.st').textContent = grid.children[i].querySelector('.st').textContent.split(' · ')[0] + ' · '+ms+'ms'; });
  });
</script>
</body>
</html>
