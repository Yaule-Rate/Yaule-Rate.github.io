<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>失眠夜の个人空间</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='5'/%3E%3Cline x1='12' y1='1' x2='12' y2='3'/%3E%3Cline x1='12' y1='21' x2='12' y2='23'/%3E%3Cline x1='4.22' y1='4.22' x2='5.64' y2='5.64'/%3E%3Cline x1='18.36' y1='18.36' x2='19.78' y2='19.78'/%3E%3Cline x1='1' y1='12' x2='3' y2='12'/%3E%3Cline x1='21' y1='12' x2='23' y2='12'/%3E%3Cline x1='4.22' y1='19.78' x2='5.64' y2='18.36'/%3E%3Cline x1='18.36' y1='5.64' x2='19.78' y2='4.22'/%3E%3C/svg%3E" type="image/svg+xml">
<meta name="creative-medium" content="interactive-prototype">
<style>
  /* ========== Reset & Base ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f0f9ff;
    color: #0f2e3a;
    line-height: 1.6;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* ========== Color Variables ========== */
  :root {
    --primary: #0284c7;
    --primary-dark: #0369a1;
    --primary-light: #38bdf8;
    --primary-pale: #e0f2fe;
    --bg: #ffffff;
    --bg-card: #f0f9ff;
    --bg-soft: #f0f9ff;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --border: #e0f2fe;
    --shadow-sm: 0 2px 8px rgba(2, 132, 199, 0.08);
    --shadow-md: 0 8px 24px rgba(2, 132, 199, 0.12);
    --shadow-lg: 0 16px 48px rgba(2, 132, 199, 0.18);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body { background: var(--bg); color: var(--text); transition: background var(--transition), color var(--transition); }
  /* 暗色模式 */
  body.dark-theme {
    --primary: #38bdf8;
    --primary-dark: #7dd3fc;
    --primary-light: #7dd3fc;
    --primary-pale: #0c4a6e;
    --bg: #082f49;
    --bg-card: #0c4a6e;
    --bg-soft: #0c4a6e;
    --text: #f3f4f6;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    --border: #0c4a6e;
  }
  body.dark-theme::before {
    background-image:
      linear-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
  }
  body.dark-theme .navbar { background: rgba(15, 15, 26, 0.7); border-bottom-color: rgba(56, 189, 248, 0.15); }
  body.dark-theme .navbar.scrolled { background: rgba(15, 15, 26, 0.85); }
  body.dark-theme .music-player { background: var(--bg-card); border-color: var(--border); }
  body.dark-theme .award-card { background: var(--bg-card); }

  /* ========== Grid Background ========== */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(2, 132, 199, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(2, 132, 199, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ========== Particles Canvas ========== */
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* ========== Navigation ========== */
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(245, 243, 255, 0.55);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid rgba(2, 132, 199, 0.12);
    transition: all 0.3s ease;
  }
  .navbar.scrolled {
    background: rgba(245, 243, 255, 0.75);
    box-shadow: 0 4px 20px rgba(2, 132, 199, 0.08);
  }
  .navbar-inner {
    max-width: 1480px;
    margin: 0 auto;
    padding: 0 16px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .navbar-logo {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.3s ease;
    letter-spacing: 0.5px;
  }
  .navbar-logo:hover { transform: scale(1.05); }
  .navbar-logo-icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
  }
  .navbar-links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    list-style: none;
    flex-wrap: wrap;
    flex: 1;
  }
  .navbar-links a {
    display: block;
    padding: 7px 11px;
    font-size: 13.5px;
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    transition: all 0.25s ease;
    font-weight: 500;
  }
  .navbar-links a {
    position: relative;
    border: 1px solid transparent;
    transition: all 0.3s ease;
  }
  .navbar-links a:hover,
  .navbar-links a.active {
    color: var(--primary-dark);
    background: transparent;
    border-color: var(--primary);
    box-shadow: 0 0 12px rgba(2, 132, 199, 0.35), inset 0 0 8px rgba(2, 132, 199, 0.08);
  }
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
  }

  /* ========== Hero Section ========== */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 120px 24px 80px;
    z-index: 2;
  }
  .hero-content {
    text-align: center;
    max-width: 900px;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    background: rgba(2, 132, 199, 0.1);
    border: 1px solid var(--primary-pale);
    border-radius: 999px;
    font-size: 13px;
    color: var(--primary-dark);
    margin-bottom: 24px;
    font-weight: 500;
  }
  .hero-badge-dot {
    width: 6px; height: 6px;
    background: var(--primary);
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  .hero-title {
    font-size: clamp(42px, 7vw, 72px);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    filter: drop-shadow(0 0 20px rgba(2, 132, 199, 0.35)) drop-shadow(0 0 40px rgba(2, 132, 199, 0.15));
  }
  .hero-subtitle {
    font-size: clamp(16px, 2vw, 20px);
    color: var(--text-secondary);
    margin-bottom: 20px;
    font-weight: 500;
  }
  .hero-tagline {
    font-size: clamp(14px, 1.6vw, 17px);
    color: var(--text-muted);
    margin-bottom: 40px;
    font-style: italic;
  }
  .hero-tags {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hero-tag {
    padding: 10px 22px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: var(--primary-dark);
    transition: all 0.3s ease;
    cursor: default;
  }
  .hero-tag:hover {
    background: var(--primary);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--primary);
  }
  .hero-scroll {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 12px;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }

  /* ========== Section Common ========== */
  .section {
    position: relative;
    z-index: 2;
    padding: 120px 24px;
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .section-inner {
    max-width: 1200px;
    margin: 0 auto;
  }
  .section-header {
    text-align: center;
    margin-bottom: 56px;
  }
  .section-eyebrow {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(28px, 4vw, 36px);
    font-weight: 700;
    color: var(--text);
    margin-bottom: 40px;
    letter-spacing: -0.01em;
    position: relative;
    text-align: center;
  }
  .section-title::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    border-radius: 2px;
  }
  .section-desc {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 600px;
    margin: 0 auto;
  }

  /* ========== About Section ========== */
  .about-section {
    position: relative;
    overflow: hidden;
  }
  .about-grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 48px;
    align-items: center;
  }
  .about-text h3 {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
  }
  .about-text p {
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.8;
    margin-bottom: 24px;
  }
  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .skill-tag {
    padding: 6px 14px;
    background: rgba(2, 132, 199, 0.08);
    border: 1px solid var(--primary-pale);
    border-radius: 999px;
    font-size: 13px;
    color: var(--primary-dark);
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .skill-tag:hover {
    background: var(--primary);
    color: #fff;
  }
  .radar-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .radar-svg {
    width: 100%;
    max-width: 380px;
    height: auto;
  }

  /* ========== Floating Bubbles (About Section) ========== */
  .bubble-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(2, 132, 199, 0.12);
    border: 1px solid rgba(2, 132, 199, 0.2);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    z-index: 1;
    animation: float-bubble linear infinite, bubble-opacity ease-in-out infinite;
    text-shadow: 0 1px 2px rgba(2, 132, 199, 0.3);
  }
  @keyframes float-bubble {
    0% { transform: translate(0, 0); }
    25% { transform: translate(10px, -15px); }
    50% { transform: translate(-8px, -25px); }
    75% { transform: translate(12px, -10px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes bubble-opacity {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 0.95; }
  }

  /* ========== Timeline Section ========== */
  .timeline {
    position: relative;
    max-width: 800px;
    margin: 0 auto;
    padding-left: 30px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    margin-bottom: 32px;
    padding-left: 30px;
    width: 100%;
    left: 0;
    text-align: left;
  }
  .timeline-dot {
    position: absolute;
    left: -26px;
    top: 6px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--border);
    border: 3px solid var(--bg);
    transition: all 0.5s ease;
    right: auto;
  }
  .timeline-item.active .timeline-dot,
  .timeline-item.visible .timeline-dot {
    background: var(--primary);
    transform: scale(1.2);
    box-shadow: 0 0 12px var(--primary);
  }
  .timeline-year {
    font-size: 14px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .timeline-card {
    background: var(--bg-card);
    padding: 20px 24px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
  }
  .timeline-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, var(--primary), var(--primary-light));
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .timeline-card:hover::before { opacity: 1; }
  .timeline-card:hover {
    transform: translateX(4px);
    border-color: var(--primary);
    box-shadow: var(--shadow-md);
  }
  .timeline-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .timeline-desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
  }
  /* ========== Hobbies Section ========== */
  .hobbies-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
  }
  .hobby-card {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 28px 20px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .hobby-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    transform: scaleX(0);
    transition: transform 0.35s ease;
  }
  .hobby-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(2, 132, 199, 0.2), 0 0 20px rgba(2, 132, 199, 0.1);
    border-color: var(--primary-light);
  }
  .hobby-card:hover::before {
    transform: scaleX(1);
  }
  .hobby-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(167,139,250,0.1));
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    color: var(--primary-dark);
  }
  .hobby-icon svg { width: 32px; height: 32px; }
  .hobby-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
  }
  .hobby-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 14px;
    flex: 1;
  }
  .hobby-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .hobby-tag {
    padding: 4px 10px;
    background: rgba(2, 132, 199, 0.08);
    border-radius: 999px;
    font-size: 11px;
    color: var(--primary-dark);
    font-weight: 500;
  }

  /* ========== Games Section ========== */
  .games-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }
  .game-card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 36px 32px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .game-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
  }
  .game-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
  }
  .game-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .game-logo {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 20px;
  }
  .game-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
  }
  .game-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .game-info-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 24px;
  }
  .game-info-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .game-info-label {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-dark);
    min-width: 80px;
    padding-top: 1px;
  }
  .game-info-value {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .game-desc {
    padding: 16px 18px;
    background: var(--bg-soft);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--primary);
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  /* ========== Device Section ========== */
  .device-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
  }
  .device-card {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 32px 24px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: all 0.35s ease;
    position: relative;
    overflow: hidden;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .device-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    transform: scaleX(0);
    transition: transform 0.35s ease;
  }
  .device-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 32px rgba(2, 132, 199, 0.2), 0 0 20px rgba(2, 132, 199, 0.1);
    border-color: var(--primary-light);
  }
  .device-card:hover::before {
    transform: scaleX(1);
  }
  .device-icon {
    width: 60px; height: 60px;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(167,139,250,0.08));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-dark);
  }
  .device-icon svg { width: 26px; height: 26px; }
  .device-category {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .device-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .device-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.7;
    margin-top: auto;
    padding-top: 8px;
  }

  /* ========== Robotics Section ========== */
  .robotics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }
  .robotics-card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 40px 36px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: all 0.35s ease;
    min-height: 320px;

(function() {

  const followCloseBtn = document.getElementById('followCloseBtn');
  let followTimer = null;

  function showFollowModal() {
    followModal.classList.add('show');
    // 3秒后自动关闭
    if (followTimer) clearTimeout(followTimer);
    followTimer = setTimeout(hideFollowModal, 3500);
  }

  function hideFollowModal() {
    if (followTimer) { clearTimeout(followTimer); followTimer = null; }
    followModal.classList.remove('show');

  if (followBtn) {
    followBtn.addEventListener('click', function() {
      // 按钮点击反馈动画

      setTimeout(function() { followBtn.style.transform = ''; }, 150);
      showFollowModal();
    });
  }

  if (followCloseBtn) {
    followCloseBtn.addEventListener('click', hideFollowModal);
  }

  // 点击遮罩层关闭
  if (followModal) {
    followModal.addEventListener('click', function(e) {
      if (e.target === followModal) hideFollowModal();
    });
  }
})();

/* ========== Particles ========== */
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let width, height;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function createParticles() {
    particles = [];
    const count = Math.min(25, Math.floor(width / 50));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 3 + 1.5,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        opacity: Math.random() * 0.4 + 0.2
      });
    }
  }
  createParticles();
  window.addEventListener('resize', createParticles);

  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = width;
      if (p.x > width) p.x = 0;
      if (p.y < 0) p.y = height;
      if (p.y > height) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(2, 132, 199, ' + p.opacity + ')';
      ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

/* ========== Navbar Scroll & Active Link ========== */
(function() {
  const navbar = document.getElementById('navbar');
  const navLinks = document.querySelectorAll('.navbar-links a');
  const sections = document.querySelectorAll('section[id]');
  const navToggle = document.getElementById('navToggle');
  const navLinksBox = document.getElementById('navLinks');

  // scroll effect
  window.addEventListener('scroll', function() {
    if (window.scrollY > 20) {
      navbar.classList.add('scrolled');
    } else {
      navbar.classList.remove('scrolled');
    }
  });

  // active link on scroll
  function updateActive() {
    let current = 'home';
    const scrollY = window.scrollY + 100;
    sections.forEach(function(section) {
      if (scrollY >= section.offsetTop) {
        current = section.id;
      }
    });
    navLinks.forEach(function(link) {
      link.classList.remove('active');
      if (link.getAttribute('href') === '#' + current) {
        link.classList.add('active');
      }
    });
  }
  window.addEventListener('scroll', updateActive);
  updateActive();

  // mobile toggle
  navToggle.addEventListener('click', function() {
    navLinksBox.classList.toggle('open');
  });

  // close mobile menu on link click
  navLinks.forEach(function(link) {
    link.addEventListener('click', function() {
      navLinksBox.classList.remove('open');
    });
  });
})();

(function() {

    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2000);
  }
  btn.addEventListener('click', function() {

    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function() {
        showToast('链接已复制到剪贴板');
      }).catch(function() {
        fallbackCopy(url);
      });
    } else {
      fallbackCopy(url);
    }
  });
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('链接已复制到剪贴板'); }
    catch(e) { showToast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  }
})();

/* ========== Meteor Shower (Full Screen, No White Head) ========== */
(function() {
  const canvas = document.getElementById('meteorCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let meteors = [];
  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  function createMeteor() {
    // 从整个屏幕宽度均匀分布
    const startX = Math.random() * width;
    const startY = -100 - Math.random() * 300;
    const angle = Math.PI / 4 + (Math.random() - 0.5) * 0.15;
    const speed = 1.5 + Math.random() * 1.5;
    const length = 180 + Math.random() * 120;
    return {
      x: startX,
      y: startY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      length: length,
      opacity: 0.4 + Math.random() * 0.4,
      size: 1.2 + Math.random() * 1.2
    };
  }
  function initMeteors() {
    meteors = [];
    const count = 12;
    for (let i = 0; i < count; i++) {
      const m = createMeteor();
      m.x = Math.random() * width;
      m.y = Math.random() * height;
      meteors.push(m);
    }
  }
  initMeteors();
  window.addEventListener('resize', initMeteors);
  let frameCount = 0;
  function animate() {
    ctx.clearRect(0, 0, width, height);
    frameCount++;
    if (frameCount % 100 === 0 && meteors.length < 16) {
      meteors.push(createMeteor());
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx;
      m.y += m.vy;
      // 计算拖尾终点
      const tailLen = m.length;
      const tailX = m.x - m.vx * (tailLen / (Math.sqrt(m.vx*m.vx + m.vy*m.vy)));
      const tailY = m.y - m.vy * (tailLen / (Math.sqrt(m.vx*m.vx + m.vy*m.vy)));
      // 渐变线条：头部亮，尾部暗（无白色光点）
      const gradient = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
      gradient.addColorStop(0, 'rgba(216, 180, 254, ' + m.opacity + ')');
      gradient.addColorStop(0.3, 'rgba(56, 189, 248, ' + (m.opacity * 0.7) + ')');
      gradient.addColorStop(0.7, 'rgba(56, 189, 248, ' + (m.opacity * 0.3) + ')');
      gradient.addColorStop(1, 'rgba(2, 132, 199, 0)');
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tailX, tailY);
      ctx.strokeStyle = gradient;
      ctx.lineWidth = m.size;
      ctx.lineCap = 'round';
      ctx.stroke();
      // 头部微亮光点（紫色，非白色）
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.size * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(216, 180, 254, ' + (m.opacity * 0.6) + ')';
      ctx.fill();
      if (m.x > width + 200 || m.y > height + 200) {
        meteors[i] = createMeteor();
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
})();
/* ========== Run Days & Stay Time Counter ========== */
(function() {
  // 网站上线日期：2025-01-01
  const launchDate = new Date('2025-01-01T00:00:00');
  const now = new Date();
  const diffDays = Math.floor((now - launchDate) / (1000 * 60 * 60 * 24));
  document.getElementById('runDays').textContent = Math.max(0, diffDays);
  // 停留时间
  let seconds = 0;
  const minEl = document.getElementById('stayMin');
  const secEl = document.getElementById('staySec');
  setInterval(function() {
    seconds++;
    minEl.textContent = Math.floor(seconds / 60);
    secEl.textContent = seconds % 60;
  }, 1000);
})();
/* ========== Scroll Reveal Animation ========== */
(function() {
  const reveals = document.querySelectorAll('.reveal');
  const awardsContainer = document.getElementById('awardsZContainer');
  function checkReveal() {
    reveals.forEach(function(el) {
      const top = el.getBoundingClientRect().top;
      if (top < window.innerHeight - 80) {
        el.classList.add('visible');
      }
    });
    // Z形荣誉奖项动画
    if (awardsContainer) {
      const top = awardsContainer.getBoundingClientRect().top;
      if (top < window.innerHeight - 100) {
        awardsContainer.classList.add('visible');
      }
    }
  }
  window.addEventListener('scroll', checkReveal);
  checkReveal();
})();

/* ========== Konami Code Rain (↑↑↓↓←→←→BA) ========== */
(function() {
  const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  let konamiIndex = 0;
  const canvas = document.getElementById('codeRainCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let columns = [];
  let drops = [];
  let animationId = null;
  let isActive = false;
  const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const fontSize = 16;
    columns = Math.floor(canvas.width / fontSize);
    drops = [];
    for (let i = 0; i < columns; i++) {
      drops[i] = Math.random() * -100;
    }
  }
  function draw() {
    ctx.fillStyle = 'rgba(8, 47, 73, 0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#38bdf8';
    ctx.font = '16px monospace';
    for (let i = 0; i < drops.length; i++) {
      const text = chars.charAt(Math.floor(Math.random() * chars.length));
      ctx.fillText(text, i * 16, drops[i] * 16);
      if (drops[i] * 16 > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
    animationId = requestAnimationFrame(draw);
  }
  function startRain() {
    if (isActive) return;
    isActive = true;
    resize();
    canvas.classList.add('active');
    draw();
    // 5秒后自动停止
    setTimeout(stopRain, 6000);
  }
  function stopRain() {
    isActive = false;
    canvas.classList.remove('active');
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', function() {
    if (isActive) resize();
  });
  document.addEventListener('keydown', function(e) {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === konamiCode[konamiIndex]) {
      konamiIndex++;
      if (konamiIndex === konamiCode.length) {
        konamiIndex = 0;
        startRain();
      }
    } else {
      konamiIndex = (key === konamiCode[0]) ? 1 : 0;
    }
  });
})();

/* ========== Music Player Control ========== */
(function() {
  const player = document.getElementById('musicPlayer');
  const playBtn = document.getElementById('musicPlayBtn');
  const playIcon = document.getElementById('musicPlayIcon');
  const audio = document.getElementById('bgMusic');
  if (!player || !playBtn || !audio) return;
  let isPlaying = false;
  const playSvg = '<polygon points="6 4 20 12 6 20 6 4"/>';
  const pauseSvg = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  playBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (isPlaying) {
      audio.pause();
      playIcon.innerHTML = playSvg;
      player.classList.add('paused');
      isPlaying = false;
    } else {
      audio.play().then(function() {
        playIcon.innerHTML = pauseSvg;
        player.classList.remove('paused');
        isPlaying = true;
      }).catch(function() {
        // 播放失败静默处理
      });
    }
  });
  audio.addEventListener('ended', function() {
    playIcon.innerHTML = playSvg;
    player.classList.add('paused');
    isPlaying = false;
  });
})();

/* ========== Back to Top Button ========== */
(function() {
  const btn = document.getElementById('btnBackTop');
  if (!btn) return;
  window.addEventListener('scroll', function() {
    if (window.scrollY > 400) {
      btn.style.opacity = '1';
      btn.style.visibility = 'visible';
    } else {
      btn.style.opacity = '0';
      btn.style.visibility = 'hidden';
    }
  });
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

/* ========== Pie Chart Animation + Timeline Active ========== */
(function() {
  // 扇形图入场动画
  const pieContainer = document.getElementById('pieContainer');
  if (pieContainer) {
    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          pieContainer.classList.add('visible');
        }
      });
    }, { threshold: 0.3 });
    observer.observe(pieContainer);
  }
  // 时间线active状态
  const timelineItems = document.querySelectorAll('.timeline-item');
  if (timelineItems.length > 0) {
    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('active', 'visible');
        }
      });
    }, { threshold: 0.3 });
    timelineItems.forEach(function(item) { observer.observe(item); });
  }
})();
